    <!-- Brže učitavanje Supabase API-ja (već koristi klijent u aplikaciji) -->
    <link rel="preconnect" href="https://ldmsmdcprrxetcpraime.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ldmsmdcprrxetcpraime.supabase.co" />

    <!--
      Google Analytics 4 (GA4) — preconnect sprema mrežu za Google servere pre nego što skript stigne.
      Sami skriptovi se učitavaju ispod, samo ako je VITE_GA_ID definisan na Vercelu.
    -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!--
      ODLUKA (odstupanje od Vite “zlatnog standarda”):
      - Podrazumevani Vite template koristi /vite.svg kao favicon — zamenjeno je sa /favicon.svg
        da kartica u pregledaču i obeleživači prikazuju ikonicu u stilu tvog portfolija (boje + EKG motiv).
      - type="image/svg+xml" ostaje kao u Vite šablonu jer SVG favicon skalira oštro na svim DPI.
      - VAŽNO (Safari / automatski zahtev): pregledači često traže /favicon.ico pre nego što pročitaju <link>.
        Zbog SPA rewrite pravila na Vercelu, /favicon.ico je vraćao index.html umesto slike — zato je u
        vercel.json dodat redirect sa favicon.ico na favicon.svg (vidi taj fajl).
    -->
    <!--
      Google Analytics 4 — ODLUKA (odstupanje od "zlatnog standarda"):
      Ključ (Measurement ID, npr. G-XXXXXXXXXX) dolazi iz Vercel → Settings → Environment Variables
      pod nazivom NEXT_PUBLIC_GA_ID (korisnik je već postavio ovo ime na Vercelu).
      Vite zamenjuje %NEXT_PUBLIC_GA_ID% pri BUILD-u jer je u vite.config.js dodat envPrefix za NEXT_PUBLIC_.

      Zaštita: ako NEXT_PUBLIC_GA_ID nije postavljen ili je prazan, GA se NE učitava — bez grešaka.
      SPA praćenje: React Router ne radi reload, pa App.jsx šalje page_view na svakoj promeni rute.
    -->
    <script>
      (function () {
        var id = '%NEXT_PUBLIC_GA_ID%';
        // Ako env var nije definisan ili je prazan, preskačemo inicijalizaciju
        if (!id || id.indexOf('PUBLIC_GA_ID') !== -1) return;

        // Postavljamo gtag helper pre nego što se async skript učita
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id, {
          send_page_view: false,  // SPA: page_view šaljemo ručno iz App.jsx na promenu rute
          anonymize_ip: true      // Dobra praksa (GDPR)
        });

        // Asinhron: ne blokira render stranice
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Z. Mijailović | Cardiology &amp; AI Portfolio</title>

        ]

    </script>
